name: IBK Check PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  check-pr:
    if: github.event_name == 'pull_request' || github.event.comment.body == 'ibk check pr'
    runs-on: macos-15

    steps:
      - name: 🧾 Checkout PR
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.event.issue.pull_request.head.repo.full_name }}
          
      - name: 🔄 Select Xcode 16.3 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: 💬 Saludo inicial (solo por comentario)
        if: github.event.comment.body == 'ibk check pr'
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"body": "🎉 ¡Hola! Gracias por tu comentario `ibk check pr`. Estamos corriendo tus pruebas ahora mismo 🧪. ¡Suerte! 🍀"}' \
            ${{ github.event.issue.comments_url }}

      - name: 🔧 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: 📦 Install dependencies
        run: bundle install

      - name: ✅ Run Fastlane tests for SPM
        run: bundle exec fastlane test

      - name: 📊 Extract Coverage (SwiftPM)
        id: coverage
        run: |
          COVERAGE_LINE=$(xcrun llvm-cov export .build/debug/TestFFPackageTests.xctest/Contents/MacOS/TestFFPackageTests -instr-profile .build/debug/codecov/default.profdata | grep -A 1 '"data"' | tail -1)
          COVERAGE_PERCENT=$(echo "$COVERAGE_LINE" | awk -F',' '{printf "%.2f", $4*100}')
          echo "coverage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT

      - name: 💬 Comentar resultado en el PR
        if: always() && github.event.comment.body == 'ibk check pr'
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            comment_body="✅ ¡Éxito! Las pruebas pasaron correctamente. Cobertura estimada: ${{ steps.coverage.outputs.coverage }}%. Puedes hacer merge con confianza 🚀"
          else
            comment_body="❌ Algo salió mal. Revisa los errores aquí: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"body\": \"$comment_body\"}" \
            ${{ github.event.issue.comments_url }}
